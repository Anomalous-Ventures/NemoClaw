version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
- package-ecosystem: docker
  directories:
  - /
  - /agents/hermes
  - /test
  - /test/e2e
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
- package-ecosystem: npm
  directories:
  - /
  - /nemoclaw
  - /test
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
- package-ecosystem: uv
  directory: /
  multi-ecosystem-group: weekly-patches
  patterns:
  - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  allow:
  - dependency-type: direct
    update-types:
    - version-update:semver-patch
multi-ecosystem-groups:
  weekly-patches:
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
